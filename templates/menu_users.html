<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="static/css/style-home.css">
  <title>Health FAQ - 2026</title>
</head>
<body style="margin: 0 6rem;">
  <nav class="nav-bar">
    <a href="{{ url_for('home') }}" class="logo-link">
      <h2 class="logo" style="margin: 0">FAQ</h2>
    </a>
  </nav>
  
  <div class="container mt-5">
    <table class="table align-middle">
      <thead>
        <tr>
          <th scope="col">id</th>
          <th scope="col">Username</th>
          <th scope="col">Email</th>
          <th scope="col">Role</th>
          <th scope="col">Status</th>
          <th scope="col">Edit</th>
          <th scope="col">Change Status</th>
        </tr>
      </thead>
      <tbody>
        {% for id_user, username, email, role, id_status, status_name in users %}
        <tr>
          <th scope="row">{{ id_user }}</th>
          <td>{{ username }}</td>
          <td>{{ email }}</td>
          <td>
            {% if role == 1 %}Admin{% elif role == 2 %}Guest{% else %}{{ role }}{% endif %}
          </td>
          
          <td id="status-text-{{ id_user }}">{{ status_name }}</td>
          
          <td>
            <button type="button" class="btn btn-link p-0 edit-user-btn" 
                    data-bs-toggle="modal" 
                    data-bs-target="#modalUpdateUser"
                    data-user-id="{{ id_user }}"
                    data-username="{{ username }}"
                    data-email="{{ email }}"
                    data-role="{{ role }}">
              <img src="static/edit-icon.png" alt="Edit user icon" width="16" height="16">
            </button>
          </td>
          
          <td>
            <button class="btn toggle-status-btn {% if id_status == 1 %}btn-danger{% else %}btn-success{% endif %}" 
                    data-user-id="{{ id_user }}" 
                    data-next-status="{% if id_status == 1 %}2{% else %}1{% endif %}">
                {% if id_status == 1 %}Deactivate{% else %}Activate{% endif %}
            </button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <div class="modal fade" id="modalUpdateUser" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form action="{{ url_for('update_user') }}" method="POST">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="editModalLabel">Edit User</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">  
              
              <input type="hidden" id="edit-user-id" name="id">

              <div class="mb-3">
                  <label class="form-label fw-bold">Editing User ID: <span id="edit-user-id-display" class="text-primary"></span></label>
              </div>

              <div class="mb-3">
                  <label for="edit-username" class="form-label">Username</label>
                  <input type="text" class="form-control" id="edit-username" name="username" required>
              </div>

              <div class="mb-3">
                  <label for="edit-email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="edit-email" name="email" required>
              </div> 

              <div class="mb-3">
                  <label for="edit-role" class="form-label">Role</label>
                  <select class="form-select" id="edit-role" name="role" required>
                    <option value="1">Admin</option>
                    <option value="2">Guest</option>
                  </select>
              </div>
                          
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Script 1: Populates the modal fields dynamically before opening
    const modalUpdateUser = document.getElementById('modalUpdateUser');
    if (modalUpdateUser) {
        modalUpdateUser.addEventListener('show.bs.modal', function (event) {
            // Target element triggering modal initiation
            const button = event.relatedTarget;
            
            // Extract attributes data sequence
            const userId = button.getAttribute('data-user-id');
            const username = button.getAttribute('data-username');
            const email = button.getAttribute('data-email');
            const role = button.getAttribute('data-role');

            // Pass key details into designated form inputs
            document.getElementById('edit-user-id').value = userId;
            document.getElementById('edit-user-id-display').textContent = userId;
            document.getElementById('edit-username').value = username;
            document.getElementById('edit-email').value = email;
            
            const roleSelect = document.getElementById('edit-role');
            roleSelect.value = role;

            // Integrity Constraint: Disable role select if editing User ID 1 or 2
            if (userId === "1" || userId === "2") {
                roleSelect.disabled = true;
            } else {
                roleSelect.disabled = false;
            }
        });
    }

    // Script 2: Handles asynchronous status change cycles via Fetch
    document.querySelectorAll('.toggle-status-btn').forEach(button => {
      button.addEventListener('click', function() {
          const userId = this.getAttribute('data-user-id');
          const nextStatus = parseInt(this.getAttribute('data-next-status'), 10);

          fetch('/admin/change_status', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ user_id: userId, target_status: nextStatus })
          })
          .then(response => response.json())
          .then(data => {
              if (data.status === 'success') {
                  this.setAttribute('data-next-status', data.next_status);
                  if (data.current_status === 1) {
                      this.textContent = 'Deactivate';
                      this.className = 'btn toggle-status-btn btn-danger';
                  } else {
                      this.textContent = 'Activate';
                      this.className = 'btn toggle-status-btn btn-success';
                  }
                  const statusCell = document.getElementById('status-text-' + userId);
                  if (statusCell) { statusCell.textContent = data.status_name; }
              } else {
                  alert('Error updating status: ' + data.message);
              }
          })
          .catch(error => console.error('Error changing user status:', error));
      });
    });
  </script>
</body>
</html>
